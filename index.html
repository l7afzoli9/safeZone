<!doctype html>
<html lang="fr" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5C66" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Amin</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('amin_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolvedTheme = savedTheme === 'system' ? (prefersDark ? 'dark' : 'light') : savedTheme;
          document.documentElement.setAttribute('data-theme', resolvedTheme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', resolvedTheme === 'dark' ? '#0E1418' : '#0F5C66');

          var savedLang = localStorage.getItem('amin_language') || 'fr';
          var validLang = savedLang === 'ar' || savedLang === 'fr' ? savedLang : (savedLang === 'ary' ? 'ar' : 'fr');
          document.documentElement.setAttribute('lang', validLang);
          document.documentElement.setAttribute('dir', validLang === 'fr' ? 'ltr' : 'rtl');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
